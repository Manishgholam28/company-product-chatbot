# DigitalOcean App Platform template. Set the private repository before deploying.
# Set OPENAI_API_KEY in the control panel as an encrypted RUN_TIME variable.
name: company-product-chatbot
region: sgp
alerts:
  - rule: DEPLOYMENT_FAILED
  - rule: DOMAIN_FAILED
ingress:
  rules:
    - component:
        name: chatbot
        preserve_path_prefix: true
      match:
        path:
          prefix: /
services:
  - name: chatbot
    github:
      repo: YOUR_GITHUB_OWNER/YOUR_PRIVATE_REPOSITORY
      branch: main
      deploy_on_push: false
    source_dir: /
    dockerfile_path: Dockerfile
    http_port: 8080
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-2gb
    health_check:
      http_path: /api/health
      initial_delay_seconds: 10
      period_seconds: 10
      timeout_seconds: 5
      failure_threshold: 12
      success_threshold: 1
    termination:
      grace_period_seconds: 180
    envs:
      - key: PORT
        value: "8080"
        scope: RUN_TIME
        type: GENERAL
      - key: CHAT_REQUESTS_PER_MINUTE
        value: "30"
        scope: RUN_TIME
        type: GENERAL
      - key: OPENAI_API_KEY
        value: ""
        scope: RUN_TIME
        type: SECRET
